name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: ruff
        run: pipx run ruff==0.15.12 check tools/
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: headers compile standalone for wasm32
        run: tests/selftest.sh headers
      - name: build and check examples/minimal
        run: tests/selftest.sh example
      - name: manifest_check.py cases
        run: tests/selftest.sh manifest
      - name: wasm_check.py cases
        run: tests/selftest.sh wasm
      - name: ecapp.py round trip (throwaway key)
        run: tests/selftest.sh ecapp
      - name: ecapp.py round trip without the cryptography package (openssl fallback)
        run: |
          python3 -m venv --without-pip "$RUNNER_TEMP/bare"
          PATH="$RUNNER_TEMP/bare/bin:$PATH" tests/selftest.sh ecapp
